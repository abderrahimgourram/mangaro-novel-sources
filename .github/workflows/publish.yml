name: Publish validated novel rules
on:
  workflow_dispatch:
    inputs:
      revision:
        description: New strictly increasing revision
        type: number
        required: true
      rollback_revision:
        description: Optional prior revision to revalidate and reissue (0 for current rules)
        type: number
        default: 0
      sources:
        description: Comma-separated source IDs for v2 partial staging; empty uses legacy full format
        type: string
        default: ''
      publication_source:
        description: Optional changed domain; requires authenticated CURRENT and exact preservation of all other mappings
        type: string
        default: ''
      staging_run:
        description: Successful main staging run for explicit genesis acceptance (0 prepares a candidate)
        type: number
        default: 0
      native_evidence:
        description: Owner-attested local Android acceptance JSON bound to the exact staging bytes
        type: string
        default: ''
      initial_release:
        description: Explicitly prepare the first CURRENT; no previous release or rollback authority
        type: boolean
        default: false
      stage_only:
        description: Verify signed staging without writing Releases or the production feed
        type: boolean
        default: true
      reviewed:
        description: Security, licensing and content-handling review completed
        type: boolean
        default: false
        required: true
permissions:
  contents: read
env:
  MANGARO_AUTOPUBLISH_ENABLED: 'false'
concurrency:
  group: novel-rules-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.reviewed && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    environment: reviewed-novel-rules
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RULE_REVISION: ${{ inputs.revision }}
      ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
      INITIAL_RELEASE: ${{ inputs.initial_release }}
      RULE_SOURCES: ${{ inputs.sources }}
      PUBLICATION_SOURCE: ${{ inputs.publication_source }}
      STAGING_RUN: ${{ inputs.staging_run }}
      NATIVE_EVIDENCE: ${{ inputs.native_evidence }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate compatibility, increasing revision and optional rollback
        run: |
          python -m unittest discover -s tests -v
          if [ "$STAGING_RUN" != 0 ]; then exit 0; fi
          initial_args=()
          if [ "$INITIAL_RELEASE" = true ]; then initial_args+=(--initial-release); fi
          if [ -n "$RULE_SOURCES" ]; then initial_args+=(--sources "$RULE_SOURCES"); fi
          python tools/prepare.py --revision "$RULE_REVISION" --rollback "$ROLLBACK_REVISION" "${initial_args[@]}"
      - name: Restore authenticated staging and explicit native byte bindings
        if: inputs.staging_run != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/genesis.py restore
      - name: Health-check the exact candidate before accessing the signing key
        run: |
          health_args=()
          if [ -n "$PUBLICATION_SOURCE" ]; then health_args+=(--source "$PUBLICATION_SOURCE"); fi
          python tools/health.py --bundle bundle.json "${health_args[@]}"
        env:
          SEANOVEL_ATTESTATION_SECRET: ${{ secrets.SEANOVEL_ATTESTATION_SECRET }}
      - name: Sign only after every probe passes
        env:
          RULE_SIGNING_KEY: ${{ secrets.NOVEL_RULE_SIGNING_KEY }}
        run: |
          key_file="$RUNNER_TEMP/novel-rules.pem"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          test -n "$RULE_SIGNING_KEY"
          printf '%s' "$RULE_SIGNING_KEY" > "$key_file"
          if [ "$STAGING_RUN" = 0 ]; then
            NOVEL_RULE_SIGNING_KEY_FILE="$key_file" python tools/package.py
          else
            python tools/genesis.py accept
          fi
      - name: Verify both signatures and hash/version bindings
        run: python tools/verify.py
      - name: Publish immutable assets, then advance the CURRENT feed
        if: ${{ !inputs.stage_only && inputs.staging_run == 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish.py
      - name: Publish explicit accepted genesis and authentic CURRENT journal
        if: ${{ !inputs.stage_only && inputs.staging_run != 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RULE_SIGNING_KEY: ${{ secrets.NOVEL_RULE_SIGNING_KEY }}
        run: python tools/genesis.py publish
      - name: Retain exact verified staging bytes without publication
        if: inputs.stage_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-novel-staging-${{ github.run_id }}
          path: |
            staging/manifest.json
            staging/rules-${{ inputs.revision }}.json
            staging/acceptance.json
          if-no-files-found: error
          retention-days: 7
      - name: Write source status summary
        if: always()
        run: python tools/report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: publication-health-no-content
          path: health.json
          if-no-files-found: warn
          retention-days: 7
