name: Independent Mknov health
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Anonymous public sample; deep also validates one complete index
        type: choice
        options: [monitor, deep]
        default: monitor
  schedule:
    - cron: '17 6 * * *'
    - cron: '47 7 * * 0'
  push:
    branches: ['monitor/mknov-health-*']
    paths:
      - '.github/workflows/mknov-health.yml'
      - 'tools/mknov_health.py'
      - 'tests/test_mknov_health.py'
      - 'tests/fixtures/mknov/**'
      - 'MKNOV_MONITORING.md'
permissions:
  contents: read
concurrency:
  group: mknov-health-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline synthetic Mknov contracts only
        run: python -m unittest discover -s tests -p test_mknov_health.py -v
  observe:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe public API with bounded read-only requests
        env:
          MKNOV_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '47 7 * * 0' && 'deep' || 'monitor' }}
        run: python tools/mknov_health.py --mode "$MKNOV_MODE" --output "$RUNNER_TEMP/mknov-health-report.json"
      - name: Retain only safe diagnostic metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mknov-health-${{ github.run_id }}
          path: ${{ runner.temp }}/mknov-health-report.json
          if-no-files-found: error
          retention-days: 7
