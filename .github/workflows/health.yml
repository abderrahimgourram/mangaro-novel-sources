name: Novel source health
on:
  schedule:
    - cron: '43 */12 * * *'
    - cron: '53 */3 * * *'
    - cron: '29 3 * * *'
    - cron: '7 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded observation or deeper index/text sampling
        type: choice
        default: monitor
        options: [monitor, retry, deep, weekly]
      source:
        description: Registered domain, or all
        type: string
        default: all
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('novel-rules-publish-{0}', github.ref) || 'novel-source-monitoring' }}
  cancel-in-progress: false
env:
  MANGARO_AUTOPUBLISH_ENABLED: 'false'
  AUTOPUBLISH_ENABLED: 'false'
jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Filter changes inside the required check
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/changes.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.changes.outputs.fast == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Fast dependencies
        if: steps.changes.outputs.fast == 'true'
        run: python -m pip install -r requirements.txt
      - name: Deterministic reliability and existing regression tests
        if: steps.changes.outputs.fast == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate changed workflows
        if: steps.changes.outputs.workflows == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=''
      - name: Check result summary
        if: always()
        run: |
          printf 'Fast checks result: %s\n' "$CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
        env:
          CHECK_STATUS: ${{ job.status }}
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      work: ${{ steps.plan.outputs.work }}
      native: ${{ steps.plan.outputs.native }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject production publication
        if: inputs.mode == 'production'
        run: |
          printf 'Production publishing is disabled. Explicit code and environment review is required.\n' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Restore trusted history and select only due sources
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MONITOR_MODE: ${{ (inputs.mode == 'audit' || inputs.mode == 'staging') && 'manual' || inputs.mode || 'monitor' }}
          MONITOR_SOURCE: ${{ inputs.source || 'all' }}
        run: python3 tools/plan.py --system novel --restore --mode "$MONITOR_MODE" --source "$MONITOR_SOURCE"
      - name: Transfer selection and trusted history inside this run
        if: steps.plan.outputs.work == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: health-plan-${{ github.run_id }}
          path: |
            health-plan.json
            .source-health/state.json
          include-hidden-files: true
          retention-days: 1
      - name: Scheduler report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: health-plan-report-${{ github.run_id }}
          path: health-plan-report.json
          if-no-files-found: ignore
          retention-days: 7
  inspect:
    needs: plan
    if: needs.plan.outputs.work == 'true'
    environment: novel-health
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: health-plan-${{ github.run_id }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Bounded source journeys and existing SeaNovel attestation
        env:
          SEANOVEL_ATTESTATION_SECRET: ${{ secrets.SEANOVEL_ATTESTATION_SECRET }}
        run: python tools/monitor.py
      - name: Check history checkpoint is nonempty
        if: always()
        id: history
        run: python3 tools/reliability.py --checkpoint .source-health/state.json
      - name: Persist source monitoring history
        if: always() && steps.history.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-health-state-v1
          path: .source-health/state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Source execution summary
        if: always()
        env:
          SOURCE_STATUS: ${{ job.status }}
        run: |
          printf 'Novel CI execution: %s; source health is reported separately.\n' "$SOURCE_STATUS" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: novel-health-report-${{ github.run_id }}
          path: monitor-report.json
          if-no-files-found: warn
          retention-days: 7
