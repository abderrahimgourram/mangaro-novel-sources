name: Novel source health
on:
  schedule:
    - cron: '21 4 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: One source for a focused diagnosis, or all for the daily acceptance check
        type: choice
        default: all
        options: [all, kolnovel.com, cenele.com, sunovels.com, seanovel.org]
  push:
    branches: [main]
    paths: ['rules/**', 'tools/**', 'tests/**', '*.json', 'requirements.txt', '.github/workflows/**']
  pull_request:
    paths: ['rules/**', 'tools/**', 'tests/**', '*.json', 'requirements.txt', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/validate.py --revision 2
      - run: python -m unittest discover -s tests -v
  inspect:
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' ||
         (github.ref == 'refs/heads/feature/seanovel-attestation-20261009' && (inputs.source == 'seanovel.org' || inputs.source == 'all'))))
    environment: novel-health
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check the live four-source journey without retaining content
        run: python tools/health.py --source "$HEALTH_SOURCE"
        env:
          HEALTH_SOURCE: ${{ inputs.source || 'all' }}
          SEANOVEL_ATTESTATION_SECRET: ${{ secrets.SEANOVEL_ATTESTATION_SECRET }}
      - name: Write source status summary
        if: always()
        run: python tools/report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-health-no-content
          path: health.json
          if-no-files-found: error
          retention-days: 7
