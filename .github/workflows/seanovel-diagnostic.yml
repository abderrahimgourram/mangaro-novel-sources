name: SeaNovel diagnostic

on:
  workflow_dispatch:
    inputs:
      deep:
        description: Verify the signed complete index and representative texts (no publication)
        type: boolean
        default: false
      deployment:
        description: Optional staged deployment of the existing SeaNovel project
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main' && !inputs.deep
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect SeaNovel response
        run: |
          curl -sS --max-time 20 \
            -D - -o /dev/null \
            -A "MangaroNovelPrototype/0.1" \
            "https://seanovel.org/api/novels?sort=views" \
            | grep -Ei '^(HTTP/|server:|cf-ray:|content-type:|location:|retry-after:|www-authenticate:)'
  signed-check:
    if: github.ref == 'refs/heads/main' && inputs.deep
    environment: novel-health
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Verify existing protocol-v1 compatibility
        env:
          SEANOVEL_ATTESTATION_SECRET: ${{ secrets.SEANOVEL_ATTESTATION_SECRET }}
          STAGED_DEPLOYMENT: ${{ inputs.deployment }}
        run: python tools/sea_attestation.py --deployment "$STAGED_DEPLOYMENT"
      - name: Verify nonce-bound protocol-v2 source evidence; never sign or publish rules
        env:
          SEANOVEL_ATTESTATION_SECRET: ${{ secrets.SEANOVEL_ATTESTATION_SECRET }}
          STAGED_DEPLOYMENT: ${{ inputs.deployment }}
        run: python tools/sea_attestation.py --deep --deployment "$STAGED_DEPLOYMENT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seanovel-attestation-report-${{ github.run_id }}
          path: seanovel-attestation-report.json
          retention-days: 7
